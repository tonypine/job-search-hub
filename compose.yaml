name: job-search-hub

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_DB: hub
      POSTGRES_PASSWORD: ${HUB_DATABASE_PASSWORD:?set HUB_DATABASE_PASSWORD in .env; see .env.example}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # Postgres 18 images keep the cluster in a versioned directory under
      # /var/lib/postgresql, so the volume mounts there.
      - hub-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hub", "-d", "hub"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  server:
    build: ./server
    image: job-search-hub-server:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HUB_ADDR: ":8090"
      HUB_DATABASE_URL: postgres://hub:${HUB_DATABASE_PASSWORD}@db:5432/hub
      HUB_OWNER_TOKEN: ${HUB_OWNER_TOKEN:?set HUB_OWNER_TOKEN in .env; see .env.example}
      HUB_BOARD_POLL_INTERVAL: ${HUB_BOARD_POLL_INTERVAL:-1h}
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "/hub-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  hub-db:

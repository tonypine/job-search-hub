name: job-search-hub

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_DB: hub
      POSTGRES_PASSWORD: ${HUB_DATABASE_PASSWORD:?set HUB_DATABASE_PASSWORD in .env; see .env.example}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # Postgres 18 images keep the cluster in a versioned directory under
      # /var/lib/postgresql, so the volume mounts there.
      - hub-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hub", "-d", "hub"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  server:
    build: ./server
    image: job-search-hub-server:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HUB_ADDR: ":8090"
      HUB_DATABASE_URL: postgres://hub:${HUB_DATABASE_PASSWORD}@db:5432/hub
      HUB_OWNER_TOKEN: ${HUB_OWNER_TOKEN:?set HUB_OWNER_TOKEN in .env; see .env.example}
      HUB_BOARD_POLL_INTERVAL: ${HUB_BOARD_POLL_INTERVAL:-1h}
      HUB_FEED_POLL_INTERVAL: ${HUB_FEED_POLL_INTERVAL:-3h}
      # The model server and model the task routes start on, through LM Studio
      # on the host by default. Routes are changed through /v1/task-routes after.
      HUB_JOB_FACTS_MODEL_URL: ${HUB_JOB_FACTS_MODEL_URL-http://host.docker.internal:1234/v1}
      HUB_JOB_FACTS_MODEL: ${HUB_JOB_FACTS_MODEL:-qwen/qwen3.5-9b}
      HUB_JOB_FACTS_INTERVAL: ${HUB_JOB_FACTS_INTERVAL:-10m}
      # The Google OAuth client for a desktop app, from the folder mounted below.
      HUB_GOOGLE_OAUTH_CLIENT_FILE: ${HUB_GOOGLE_OAUTH_CLIENT_FILE-/config/google-oauth-client.json}
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-http://localhost:8090}
      # Where Gmail announces mailbox changes; both empty leaves it off.
      HUB_GMAIL_PUBSUB_TOPIC: ${HUB_GMAIL_PUBSUB_TOPIC:-}
      HUB_GMAIL_PUBSUB_SUBSCRIPTION: ${HUB_GMAIL_PUBSUB_SUBSCRIPTION:-}
      # The agents' prompts live in the database. A fresh one starts from the
      # private seed in the folder mounted below: <kind>.md, <kind>.schema.json.
      HUB_AGENT_PROMPTS_DIR: ${HUB_AGENT_PROMPTS_DIR-/config/agent-prompts}
      # The Firebase service account key the hub pushes updates to phones with.
      # No file there leaves pushes off.
      HUB_FIREBASE_SERVICE_ACCOUNT_FILE: ${HUB_FIREBASE_SERVICE_ACCOUNT_FILE-/config/firebase-service-account.json}
    volumes:
      # Local secrets that stay out of the repo, read-only.
      - ${HUB_CONFIG_DIR:-${HOME}/.config/job-search-hub}:/config:ro
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "/hub-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  hub-db:

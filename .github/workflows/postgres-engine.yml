# Builds the Postgres engine the hub runs on the Mac, checks it, publishes it
# as a GitHub Release asset, and checks that server/postgres-engine.lock pins
# it. See scripts/postgres-engine/README.md.
#
# A release's notes carry the SHA-256 of the recipe (build.sh) it was built
# from, and a run whose recipe already has a release skips the build: macOS
# minutes cost ten times Linux ones. So a pull request that changes the recipe
# builds and publishes once, and its later pushes (the lock among them) and the
# push to main only check the lock and the published asset. ci.yml's jobs never
# run the recipe.
#
# A run on demand builds and checks whatever the recipe has; with `publish` it
# also publishes the build as a new release, which the lock must then pin.
name: postgres-engine

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/postgres-engine/**
      - server/postgres-engine.lock
      - .github/workflows/postgres-engine.yml
  push:
    branches: [main]
    paths:
      - scripts/postgres-engine/**
      - server/postgres-engine.lock
      - .github/workflows/postgres-engine.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build as a new release, even if the recipe already has one
        type: boolean
        default: false

permissions:
  contents: read

# Never cancelled, so a publish doesn't stop half-way.
concurrency:
  group: postgres-engine-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_VERSION: "26.6"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      recipe: ${{ steps.plan.outputs.recipe }}
      release: ${{ steps.plan.outputs.release }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck scripts/postgres-engine/*.sh

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          # A fork's pull request gets a read-only token, so it can't publish.
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          version=$(scripts/postgres-engine/build.sh --version)
          recipe=$(sha256sum scripts/postgres-engine/build.sh | cut -d' ' -f1)

          # The newest release built from this recipe, if any. The API lists
          # the newest first.
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name | startswith(\"postgres-v$version-\")) | select(.body // \"\" | contains(\"Recipe: sha256:$recipe\")) | .tag_name")
          release=$(printf '%s\n' "$releases" | head -n 1)

          if [ "$EVENT" = workflow_dispatch ]; then
            build=true
            publish=$PUBLISH_INPUT
          elif [ -n "$release" ]; then
            echo "$release was built from this recipe; no build."
            build=false publish=false
          else
            build=true publish=$SAME_REPO
          fi

          {
            echo "version=$version"
            echo "recipe=$recipe"
            echo "release=$release"
            echo "build=$build"
            echo "publish=$publish"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # Apple Silicon, like the Macs the hub runs on.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      ASSET: postgres-${{ needs.plan.outputs.version }}-macos-arm64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
          xcodebuild -version

      - name: Build
        run: scripts/postgres-engine/build.sh "$RUNNER_TEMP/dist" "$RUNNER_TEMP/build"

      # The check unpacks the tarball elsewhere; with the build tree gone,
      # nothing in it can be reached through a path the build left behind.
      - name: Check
        run: |
          rm -rf "$RUNNER_TEMP/build"
          scripts/postgres-engine/check.sh "$RUNNER_TEMP/dist/$ASSET"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-engine
          path: ${{ runner.temp }}/dist/${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # One publish at a time, so two runs can't take the same tag.
    concurrency:
      group: postgres-engine-publish
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RECIPE: ${{ needs.plan.outputs.recipe }}
      ASSET: postgres-${{ needs.plan.outputs.version }}-macos-arm64.tar.gz
      # A pull request's own commit, not the merge commit GitHub makes for it.
      TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: postgres-engine
          path: ${{ runner.temp }}/dist

      # postgres-v<version>-<n>, with n one more than the highest so far.
      # --latest=false keeps the Android app's release the repository's latest.
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=0
          for ref in $(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/postgres-v$VERSION-" --jq '.[].ref'); do
            i=${ref##*-}
            case $i in '' | *[!0-9]*) continue ;; esac
            if [ "$i" -gt "$n" ]; then n=$i; fi
          done
          tag=postgres-v$VERSION-$((n + 1))

          sha256=$(cd "$RUNNER_TEMP/dist" && sha256sum "$ASSET" | cut -d' ' -f1)
          url=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$ASSET
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Postgres $VERSION for macOS on Apple Silicon, built by \`scripts/postgres-engine/build.sh\` at $TARGET and checked by \`check.sh\`.

          Recipe: sha256:$RECIPE

          \`server/postgres-engine.lock\` pins it with:

          \`\`\`text
          version=$VERSION
          url=$url
          sha256=$sha256
          \`\`\`
          EOF

          gh release create "$tag" "$RUNNER_TEMP/dist/$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "Postgres $VERSION for macOS arm64 ($tag)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest=false
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

  # The lock must pin the newest release built from this recipe, by its
  # asset's SHA-256, and that published asset must pass the check.
  lock:
    needs: [plan, build, publish]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: macos-26
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE: ${{ needs.publish.outputs.tag || needs.plan.outputs.release }}
      ASSET: postgres-${{ needs.plan.outputs.version }}-macos-arm64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the lock with the release
        run: |
          if [ -z "$RELEASE" ]; then
            echo "::error::No release was built from this recipe. Run this workflow on the branch with publish."
            exit 1
          fi
          url=https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE/$ASSET
          mkdir "$RUNNER_TEMP/published"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/published/$ASSET" "$url"
          sha256=$(cd "$RUNNER_TEMP/published" && shasum -a 256 "$ASSET" | cut -d' ' -f1)
          printf 'version=%s\nurl=%s\nsha256=%s\n' "$VERSION" "$url" "$sha256" > "$RUNNER_TEMP/expected"

          lock=server/postgres-engine.lock
          grep -E '^(version|url|sha256)=' "$lock" > "$RUNNER_TEMP/pinned" || true
          if ! diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/pinned"; then
            echo "::error file=$lock::$lock doesn't pin $RELEASE. Its lines should read:"
            cat "$RUNNER_TEMP/expected"
            exit 1
          fi
          echo "$lock pins $RELEASE, SHA-256 $sha256."

      - name: Check the published asset
        run: scripts/postgres-engine/check.sh "$RUNNER_TEMP/published/$ASSET"

# Ships the Android app: after `ci` passes on a push to main, a commit that
# changed android/ since the previous release becomes a GitHub Release,
# android-v<major>.<minor>.<commit count>, with the signed APK attached. Then,
# if a Linear key is set, the release is posted as a Job Search Hub project
# update. See docs/decisions/0001-android-release-distribution.md, and the
# README's Releases section for the secrets.
#
# workflow_run runs this file from main with the repository's secrets, so it
# only ever builds a commit already on main, never a pull request's code.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  # Posts the Linear update for an existing release again.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to post to Linear, e.g. android-v0.1.123
        required: true

permissions:
  contents: read

# One release at a time, in merge order, and a running one is never cancelled.
# GitHub keeps only the newest waiting run; one it drops is harmless, since the
# next run releases every app change since the previous release. Every other
# run (a pull request's ci, a failed ci, a Linear repost) gets a group of its
# own, so it never takes a waiting release's place.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_run' &&
    github.event.workflow_run.conclusion == 'success' &&
    github.event.workflow_run.event == 'push' &&
    github.event.workflow_run.head_branch == 'main' &&
    'release-main' || format('release-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      version_code: ${{ steps.plan.outputs.version_code }}
      version_name: ${{ steps.plan.outputs.version_name }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - id: plan
        run: |
          scripts/release/plan.sh > "$RUNNER_TEMP/plan"
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/plan"

  release:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.plan.outputs.tag }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION_CODE: ${{ needs.plan.outputs.version_code }}
      VERSION_NAME: ${{ needs.plan.outputs.version_name }}
      PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
    steps:
      # Before anything else, so a missing secret fails in seconds and by name.
      - name: Check the signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::The repository secret $name is missing. See the README's Releases › One-time setup."
              missing=1
            fi
          done
          [ -z "$missing" ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # As in ci.yml: the repo's gradle.properties points at the Mac's JDK.
      - name: Point Gradle at the runner's JDK
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties

      # Without it the app builds with pushes off, which beats no release.
      - name: Add the Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is missing, so this release has pushes off."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          jq -e '.project_info.project_id' android/app/google-services.json > /dev/null

      - name: Add the release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build the release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          ./gradlew :app:assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" --stacktrace

      - name: Remove the release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Verify the APK
        run: |
          scripts/release/verify-apk.sh android/app/build/outputs/apk/release/app-release.apk \
            com.tonypine.jobsearchhub "$VERSION_CODE" "$VERSION_NAME"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/job-search-hub-$VERSION_NAME.apk"

      - name: Write the changelog
        run: |
          scripts/release/changelog.sh "$PREVIOUS_TAG" "$SHA" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      # Creates the tag at the built commit along with the release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP/job-search-hub-$VERSION_NAME.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Android $VERSION_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"

  # Optional: without LINEAR_RELEASE_API_KEY it only says so. If Linear
  # refuses, this job fails and the release stays published; run the workflow
  # by hand with the tag to post again.
  linear:
    needs: release
    if: >-
      always() &&
      (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Post the Linear project update
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_RELEASE_API_KEY }}
          LINEAR_PROJECT: Job Search Hub
        run: |
          if [ -z "$LINEAR_API_KEY" ]; then
            echo "::notice::LINEAR_RELEASE_API_KEY isn't set, so $TAG gets no Linear update."
            exit 0
          fi
          scripts/release/linear-update.sh "$TAG"

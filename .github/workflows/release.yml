# Ships the apps: after `ci` passes on a push to main, a commit that changed
# server/ or macos/ since the previous Mac release becomes a GitHub Release,
# mac-v<major>.<minor>.<commit count>, with the signed app zipped; one that
# changed android/ since the previous Android release becomes
# android-v<major>.<minor>.<commit count>, with the signed APK. A commit that
# changed both releases both, with the same number. Then, if a Linear key is
# set, the run's releases are announced in one update on the initiative the Job
# Search Hub project belongs to. See docs/design/updates.md › Releases from CI,
# docs/decisions/0001-android-release-distribution.md, and the README's
# Releases section for the secrets.
#
# workflow_run runs this file from main with the repository's secrets, so it
# only ever builds a commit already on main, never a pull request's code.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  # Posts the Linear update for existing releases again.
  workflow_dispatch:
    inputs:
      tags:
        description: The run's release tags to post to Linear, e.g. mac-v0.1.123 android-v0.1.123
        required: true

permissions:
  contents: read

# One release at a time, in merge order, and a running one is never cancelled.
# GitHub keeps only the newest waiting run; one it drops is harmless, since the
# next run releases every change since each app's previous release. Every other
# run (a pull request's ci, a failed ci, a Linear repost) gets a group of its
# own, so it never takes a waiting release's place.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_run' &&
    github.event.workflow_run.conclusion == 'success' &&
    github.event.workflow_run.event == 'push' &&
    github.event.workflow_run.head_branch == 'main' &&
    'release-main' || format('release-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_code: ${{ steps.plan.outputs.version_code }}
      version_name: ${{ steps.plan.outputs.version_name }}
      mac_changed: ${{ steps.plan.outputs.mac_changed }}
      mac_previous_tag: ${{ steps.plan.outputs.mac_previous_tag }}
      mac_tag: ${{ steps.plan.outputs.mac_tag }}
      android_changed: ${{ steps.plan.outputs.android_changed }}
      android_previous_tag: ${{ steps.plan.outputs.android_previous_tag }}
      android_tag: ${{ steps.plan.outputs.android_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - id: plan
        run: |
          scripts/release/plan.sh > "$RUNNER_TEMP/plan"
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/plan"

  # The Mac app, with the server and its commands inside, signed with the
  # owner's Apple Development certificate. See docs/design/updates.md › The
  # Mac release job and › Signing.
  mac:
    needs: plan
    if: needs.plan.outputs.mac_changed == 'true'
    # As ci.yml's macos job: move both pins together.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      TAG: ${{ needs.plan.outputs.mac_tag }}
      VERSION_CODE: ${{ needs.plan.outputs.version_code }}
      VERSION_NAME: ${{ needs.plan.outputs.version_name }}
      PREVIOUS_TAG: ${{ needs.plan.outputs.mac_previous_tag }}
      XCODE_VERSION: "26.6"
    steps:
      # Before anything else, so a missing secret fails in seconds and by name.
      - name: Check the signing secrets
        env:
          MAC_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MAC_SIGNING_CERTIFICATE_BASE64 }}
          MAC_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MAC_SIGNING_CERTIFICATE_PASSWORD }}
          MAC_SIGNING_TEAM_ID: ${{ secrets.MAC_SIGNING_TEAM_ID }}
        run: |
          missing=
          for name in MAC_SIGNING_CERTIFICATE_BASE64 MAC_SIGNING_CERTIFICATE_PASSWORD MAC_SIGNING_TEAM_ID; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::The repository secret $name is missing. See the README's Releases › One-time setup."
              missing=1
            fi
          done
          [ -z "$missing" ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
          xcodebuild -version

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # A keychain of the job's own, with a random password, which "Remove
      # the signing keychain" deletes once the app is signed, or after
      # whichever step failed. It joins the search list so make-app.sh's
      # signing-identity.sh finds the identity, and the partition list lets
      # codesign use the key without a prompt.
      - name: Import the signing certificate
        env:
          MAC_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MAC_SIGNING_CERTIFICATE_BASE64 }}
          MAC_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MAC_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          printf '%s' "$MAC_SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 \
            -P "$MAC_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # Split on purpose: the current list, one path a line, after ours.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      # Warns 30 days before the certificate expires, and fails once it has.
      - name: Check the signing certificate
        env:
          MAC_SIGNING_TEAM_ID: ${{ secrets.MAC_SIGNING_TEAM_ID }}
        run: |
          security find-certificate -a -p "$RUNNER_TEMP/signing.keychain-db" > "$RUNNER_TEMP/certificates.pem"
          status=0
          scripts/release/check-certificate.sh "$MAC_SIGNING_TEAM_ID" "$RUNNER_TEMP/certificates.pem" \
            >> "$GITHUB_STEP_SUMMARY" || status=$?
          exit $status

      # A clean build, without ci's cache: the release is built from the
      # commit alone. CODESIGN_TEAM_ID pins the owner's team, so nothing else
      # in the keychain signs it.
      - name: Build the app
        working-directory: macos
        env:
          CODESIGN_TEAM_ID: ${{ secrets.MAC_SIGNING_TEAM_ID }}
          HUB_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          test "$(sh ../scripts/release/version.sh)" = "$VERSION_NAME"
          Scripts/make-app.sh

      - name: Remove the signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12"
          if [ -e "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi

      - name: Verify the app
        env:
          MAC_SIGNING_TEAM_ID: ${{ secrets.MAC_SIGNING_TEAM_ID }}
        run: scripts/release/verify-app.sh macos/build/JobSearchHub.app "$VERSION_NAME" "$MAC_SIGNING_TEAM_ID"

      # ditto keeps the signature's extended attributes and symlinks, which
      # zip doesn't. The copy unzipped from it, as the app will unzip a
      # download, has to verify too.
      - name: Zip the app
        env:
          MAC_SIGNING_TEAM_ID: ${{ secrets.MAC_SIGNING_TEAM_ID }}
        run: |
          zip=Job-Search-Hub-$VERSION_NAME.zip
          mkdir "$RUNNER_TEMP/assets" "$RUNNER_TEMP/unzipped"
          ditto -c -k --keepParent macos/build/JobSearchHub.app "$RUNNER_TEMP/assets/$zip"
          (cd "$RUNNER_TEMP/assets" && shasum -a 256 "$zip" > "$zip.sha256")
          cat "$RUNNER_TEMP/assets/$zip.sha256"
          ditto -x -k "$RUNNER_TEMP/assets/$zip" "$RUNNER_TEMP/unzipped"
          scripts/release/verify-app.sh "$RUNNER_TEMP/unzipped/JobSearchHub.app" "$VERSION_NAME" "$MAC_SIGNING_TEAM_ID"

      - name: Write the changelog
        run: |
          scripts/release/changelog.sh "$PREVIOUS_TAG" "$SHA" server/ macos/ > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      # Creates the tag at the built commit along with the release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "$RUNNER_TEMP/assets/Job-Search-Hub-$VERSION_NAME.zip" \
            "$RUNNER_TEMP/assets/Job-Search-Hub-$VERSION_NAME.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Job Search Hub $VERSION_NAME for Mac" \
            --notes-file "$RUNNER_TEMP/notes.md"

  android:
    needs: plan
    if: needs.plan.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      TAG: ${{ needs.plan.outputs.android_tag }}
      VERSION_CODE: ${{ needs.plan.outputs.version_code }}
      VERSION_NAME: ${{ needs.plan.outputs.version_name }}
      PREVIOUS_TAG: ${{ needs.plan.outputs.android_previous_tag }}
    steps:
      # Before anything else, so a missing secret fails in seconds and by name.
      - name: Check the signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::The repository secret $name is missing. See the README's Releases › One-time setup."
              missing=1
            fi
          done
          [ -z "$missing" ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # As in ci.yml: the repo's gradle.properties points at the Mac's JDK.
      - name: Point Gradle at the runner's JDK
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties

      # Without it the app builds with pushes off, which beats no release.
      - name: Add the Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is missing, so this release has pushes off."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          jq -e '.project_info.project_id' android/app/google-services.json > /dev/null

      - name: Add the release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build the release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          ./gradlew :app:assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" --stacktrace

      - name: Remove the release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Verify the APK
        run: |
          scripts/release/verify-apk.sh android/app/build/outputs/apk/release/app-release.apk \
            com.tonypine.jobsearchhub "$VERSION_CODE" "$VERSION_NAME"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/job-search-hub-$VERSION_NAME.apk"

      - name: Write the changelog
        run: |
          scripts/release/changelog.sh "$PREVIOUS_TAG" "$SHA" android/ > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      # Creates the tag at the built commit along with the release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP/job-search-hub-$VERSION_NAME.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Android $VERSION_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"

  # Announces every platform this run released in one Linear update, so a
  # platform whose job failed is left out. Optional: without
  # LINEAR_RELEASE_API_KEY it only says so. If Linear refuses, this job fails
  # and the releases stay published; run the workflow by hand with the tags to
  # post again.
  linear:
    needs: [plan, mac, android]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.mac.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Post the Linear update
        env:
          DISPATCH_TAGS: ${{ inputs.tags }}
          MAC_TAG: ${{ needs.mac.result == 'success' && needs.plan.outputs.mac_tag || '' }}
          ANDROID_TAG: ${{ needs.android.result == 'success' && needs.plan.outputs.android_tag || '' }}
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_RELEASE_API_KEY }}
          LINEAR_PROJECT: Job Search Hub
        # $tags is split on purpose, one argument a tag, and never globbed.
        run: |
          set -f
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tags=$DISPATCH_TAGS
          else
            tags="$MAC_TAG $ANDROID_TAG"
          fi
          if [ -z "$LINEAR_API_KEY" ]; then
            echo "::notice::LINEAR_RELEASE_API_KEY isn't set, so" $tags "get no Linear update."
            exit 0
          fi
          scripts/release/linear-update.sh $tags

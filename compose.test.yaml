# A throwaway Postgres for the store and tool tests, for agent runs, CI and
# anyone without .env:
#
#   docker compose -f compose.test.yaml up -d --wait
#   export HUB_TEST_DATABASE_URL=postgres://hub:hub-test@localhost:5435/postgres
#
# It holds only the hub_test_* databases the tests create and drop, and keeps
# nothing across restarts, so its password is no secret. It is its own compose
# project and never touches the hub's data in compose.yaml.
name: job-search-hub-test

services:
  test-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub-test
    # Durability buys nothing here, and several test runs can share the server.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=300"]
    ports:
      - "127.0.0.1:5435:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hub", "-d", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
